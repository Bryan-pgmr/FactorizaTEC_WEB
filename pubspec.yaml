name: FactorizaTEC
description: App educativa de factorización algebraica
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  sqflite: ^2.3.2
  # PWA: SQLite/WASM para web (persistencia en IndexedDB)
  sqflite_common_ffi_web: '>=0.4.3 <2.0.0'
  path: ^1.9.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
